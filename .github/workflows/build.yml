name: Build and test NurimAI
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm test
      - run: npm run test:ui
      - name: Configure public endpoints
        run: node scripts/configure-release.cjs
        env:
          NURIMAI_GATEWAY_URL: ${{ vars.NURIMAI_GATEWAY_URL }}
      - name: Windows package
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Mac universal package
        if: runner.os == 'macOS'
        shell: bash
        # On failure, surface electron-builder's error lines as annotations in the run summary.
        # Missing secrets arrive as empty strings; electron-builder treats an empty CSC_LINK as a path, so only export what exists.
        run: |
          set -o pipefail
          if [ -n "$MAC_CERTIFICATE" ]; then export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"; fi
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -n "${!name}" ] || unset "$name"; done
          npm run dist:mac 2>&1 | tee mac-build.log || { grep -E "⨯|Error|error:" mac-build.log | head -10 | sed 's/^[[:space:]]*/::error title=Mac build::/'; exit 1; }
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run verify:package
      - uses: actions/upload-artifact@v7
        with:
          name: NurimAI-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: UI-tests-${{ runner.os }}
          path: test-results/
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: NurimAI-*
          path: release-assets
          merge-multiple: true
      - name: Verify release version and gateway
        run: node scripts/check-release.cjs
        env:
          NURIMAI_GATEWAY_URL: ${{ vars.NURIMAI_GATEWAY_URL }}
      # Fixed names keep the download page links (releases/latest/download/...) valid for every version.
      - name: Add stable download names
        run: |
          cp release-assets/NurimAI-*-win-x64.exe release-assets/NurimAI-Windows-Setup.exe
          cp release-assets/NurimAI-*-mac-universal.dmg release-assets/NurimAI-Mac.dmg
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "NurimAI $RELEASE_TAG" --notes-file RELEASE-NOTES.md
