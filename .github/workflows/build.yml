name: Build and test NurimAI
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm test
      - run: npm run test:ui
      - name: Configure public endpoints
        run: node scripts/configure-release.cjs
        env:
          NURIMAI_GATEWAY_URL: ${{ vars.NURIMAI_GATEWAY_URL }}
      - name: Windows package
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Mac universal package
        if: runner.os == 'macOS'
        shell: bash
        # On failure, surface electron-builder's error lines as annotations in the run summary.
        # Missing secrets arrive as empty strings; electron-builder treats an empty CSC_LINK as a path, so only export what exists.
        run: |
          set -o pipefail
          if [ -n "$MAC_CERTIFICATE" ]; then export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"; fi
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -n "${!name}" ] || unset "$name"; done
          npm run dist:mac 2>&1 | tee mac-build.log || { grep -E "⨯|Error|error:" mac-build.log | head -10 | sed 's/^[[:space:]]*/::error title=Mac build::/'; exit 1; }
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run verify:package
      - uses: actions/upload-artifact@v7
        with:
          name: NurimAI-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: UI-tests-${{ runner.os }}
          path: test-results/
          retention-days: 7
  android:
    # The phone app (docs/app) packed by Capacitor. With the ANDROID_KEYSTORE secrets the APK is release-signed with the same key
    # every time, so new versions install over old ones; without them a debug APK is built for testing only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - name: Build APK
        working-directory: mobile
        shell: bash
        # Failures are turned into annotations (readable without access to the full log); secrets are masked by GitHub.
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          fail() { echo "::error title=$1::$2"; exit 1; }
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/nurimai.jks" 2>/dev/null || fail "Android signing" "ANDROID_KEYSTORE is not valid base64: copy the key again with the [Convert]::ToBase64String command and paste it into the secret."
            export NURIM_KEYSTORE="$RUNNER_TEMP/nurimai.jks"
            [ -n "$NURIM_KEYSTORE_PASSWORD" ] || fail "Android signing" "ANDROID_KEYSTORE_PASSWORD secret is empty or missing."
            check=$("$JAVA_HOME/bin/keytool" -list -keystore "$NURIM_KEYSTORE" -storepass "$NURIM_KEYSTORE_PASSWORD" -alias "${NURIM_KEY_ALIAS:-nurimai}" 2>&1) || fail "Android signing" "keytool could not open the key: $(echo "$check" | grep -iE 'error|exception|password|alias|tampered' | head -2 | tr '\n' ' ')"
          fi
          npx cap sync android && node ../scripts/android-csp.cjs
          cd android && chmod +x gradlew
          if [ -n "${NURIM_KEYSTORE:-}" ]; then
            ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log || true
            [ -f app/build/outputs/apk/release/app-release.apk ] || { grep -A6 "What went wrong" gradle.log | head -8 | tr '\n' ' ' | sed 's/^/::error title=Android release build::/'; echo; exit 1; }
            cp app/build/outputs/apk/release/app-release.apk ../../NurimAI-Android.apk
          else
            echo "::warning title=Android signing::ANDROID_KEYSTORE secret is not set: built a debug APK for testing (it will not update an earlier install)."
            ./gradlew --no-daemon assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../../NurimAI-Android.apk
          fi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          NURIM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NURIM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NURIM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - uses: actions/upload-artifact@v7
        with:
          name: NurimAI-Android
          if-no-files-found: error
          path: NurimAI-Android.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: NurimAI-*
          path: release-assets
          merge-multiple: true
      - name: Verify release version and gateway
        run: node scripts/check-release.cjs
        env:
          NURIMAI_GATEWAY_URL: ${{ vars.NURIMAI_GATEWAY_URL }}
      # Fixed names keep the download page links (releases/latest/download/...) valid for every version.
      - name: Add stable download names
        run: |
          cp release-assets/NurimAI-*-win-x64.exe release-assets/NurimAI-Windows-Setup.exe
          cp release-assets/NurimAI-*-mac-universal.dmg release-assets/NurimAI-Mac.dmg
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "NurimAI $RELEASE_TAG" --notes-file RELEASE-NOTES.md
  release-notes:
    # Keeps the current version's GitHub Release text in sync with RELEASE-NOTES.md after fixes on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Sync current release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then gh release edit "v$version" --notes-file RELEASE-NOTES.md; echo "Synced v$version"; else echo "No release v$version yet"; fi
